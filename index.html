<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amazon Home Page Simulation</title>
    <!-- import external css file -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Page main container, add required DevBox class -->
    <div class="container DevBox">

        <!-- Top full‑width navigation bar: contains logo, account link, cart link on right -->
        <div class="top-nav">
            <div class="wrap">
                <div class="logo">Amazon</div>
                <div class="nav-right">
                    <a href="#">Account</a>
                    <a href="#">Cart</a>
                </div>
                <!-- clear float for top‑nav inner wrap -->
            </div>
        </div>
        <!-- End of top navigation bar -->


        <!-- Search bar block: search input and search button, horizontal arrange -->
        <div class="search-area">
            <div class="wrap">
                <input type="text" class="search-input">
                <button class="search-btn">Search</button>
            </div>
        </div>
        <!-- End of search bar block -->


        <!-- Banner block: full width advertisement picture -->
        <div class="banner">
            <img src="img/banner.jpg" alt="banner">
        </div>
        <!-- End of banner block -->


        <!-- Product card area: multiple product cards arranged horizontally by float -->
        <div class="product-section">
            <div class="wrap">
                <div class="product-card">
                    <img src="img/card1.jpg" alt="product">
                    <p>Product 1</p>
                </div>
                <div class="product-card">
                    <img src="img/card2.jpg" alt="product">
                    <p>Product 2</p>
                </div>
                <div class="product-card">
                    <img src="img/card3.jpg" alt="product">
                    <p>Product 3</p>
                </div>
            </div>
        </div>
        <!-- End of product card area -->


        <!-- Footer block: page bottom text information -->
        <div class="footer">
            <p>Amazon Simulation Footer</p>
        </div>
        <!-- End of footer block -->

    </div>
</body>
</html>
